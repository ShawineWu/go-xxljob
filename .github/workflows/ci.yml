name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          # golangci-lint can only load code for Go versions up to the one it was built with; keep these in step.
          go-version: "1.26"
      - name: Lint executor
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11
      - name: Lint otelxxljob
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11
          working-directory: otelxxljob

  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24", "oldstable", "stable"] # the minimum supported version and the two latest releases
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: Test executor
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
      - name: Test otelxxljob
        working-directory: otelxxljob
        run: go test -race -count=1 ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - name: Upload coverage
        if: matrix.go == 'stable'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Fuzz each target for 20s
        run: make fuzz FUZZTIME=20s
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-failures
          path: testdata/fuzz

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: govulncheck (every module)
        run: make vuln

  e2e:
    name: e2e (xxl-job ${{ matrix.version }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: ["2.4.1", "3.4.2", "3.5.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Cache xxl-job schema
        uses: actions/cache@v6
        with:
          path: e2e/.cache
          key: xxl-job-schema-${{ matrix.version }}
      - name: Run e2e
        env:
          XXL_JOB_VERSION: ${{ matrix.version }}
        run: ./e2e/run.sh
