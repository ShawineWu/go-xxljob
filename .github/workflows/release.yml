name: Release

# Runs when a release tag is pushed: vX.Y.Z for the executor, otelxxljob/vX.Y.Z for the OpenTelemetry module. Tags are
# immutable once pushed (and the Go proxy caches them), so this workflow does not gate a release: make sure CI is green
# on the tagged commit before tagging. It records the release on GitHub.
on:
  push:
    tags: ["v*", "otelxxljob/v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Test every module
        run: make test
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
