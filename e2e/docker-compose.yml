# Admin for the xxljob end-to-end tests: MySQL 8 + xxl-job-admin (version selected by XXL_JOB_VERSION). Started and
# stopped by run.sh. The schema SQL is downloaded by run.sh into .cache/ (xxl-job is GPL-licensed, so it is not
# included in this repository).
name: xxljob-e2e
services:
  mysql:
    image: mysql:8.0.44
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./.cache/tables_xxl_job-${XXL_JOB_VERSION:-2.4.1}.sql:/docker-entrypoint-initdb.d/tables_xxl_job.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      retries: 40
  admin:
    image: xuxueli/xxl-job-admin:${XXL_JOB_VERSION:-2.4.1}
    platform: linux/amd64 # the official image is amd64-only; it runs under emulation on Apple Silicon
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # XXLJOB_E2E_ADMIN_PARAMS: version-specific arguments (set by run.sh, e.g. the global accessToken before 3.5)
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
        --spring.datasource.username=root
        --spring.datasource.password=root
        ${XXLJOB_E2E_ADMIN_PARAMS:-}
    ports:
      - "${XXLJOB_E2E_ADMIN_PORT:-18080}:8080"
    extra_hosts:
      # the executor runs on the host and the admin reaches it via host.docker.internal (Linux needs host-gateway)
      - "host.docker.internal:host-gateway"
