version: "2"

run:
  timeout: 5m
  build-tags:
    - e2e

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - modernize
    - nilerr
    - noctx
    - perfsprint
    - revive
    - testifylint
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - whitespace
  settings:
    gocritic:
      enabled-tags: [diagnostic, performance]
      disabled-checks: [hugeParam]
    gosec:
      excludes:
        - G104 # unhandled errors are covered by errcheck
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: errorf
        - name: error-strings
          disabled: true # two messages intentionally match the official executor
        - name: unused-parameter
          disabled: true
  exclusions:
    generated: lax
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, noctx, unparam, perfsprint, bodyclose]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ShawineWu/go-xxljob

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
